<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>cradle86 Web Terminal (V30 / 80C88)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css">
<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js"></script>
<style>
  :root {
    --bg: #0f1216;
    --panel: #171c23;
    --border: #2a3340;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #3fb950;
    --accent2: #58a6ff;
    --warn: #d29922;
    --danger: #f85149;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, sans-serif;
    overflow: hidden;
  }
  .app {
    display: flex; flex-direction: column; height: 100dvh; width: 100%;
  }
  header {
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
    padding: 6px 10px; background: var(--panel); border-bottom: 1px solid var(--border);
  }
  .brand {
    font-weight: 700; font-size: 14px; letter-spacing: 0.03em; margin-right: 4px;
    color: var(--accent);
  }
  .status {
    font-size: 12px; color: var(--muted); margin-right: auto;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .status.ok { color: var(--accent); }
  .status.err { color: var(--danger); }

  button {
    appearance: none; border: 1px solid var(--border); background: #212832;
    color: var(--text); border-radius: 6px; padding: 5px 10px;
    font-size: 12px; font-weight: 600; cursor: pointer; touch-action: manipulation;
    white-space: nowrap;
  }
  button:active { transform: translateY(1px); }
  button.primary { background: #1f6feb; border-color: #388bfd; color: #fff; }
  button.go { background: #238636; border-color: #2ea043; color: #fff; }
  button.danger { background: #b62324; border-color: #f85149; color: #fff; }
  button.active { background: #2d3748; border-color: var(--accent2); color: var(--accent2); }
  button:disabled { opacity: 0.45; cursor: not-allowed; }

  .toolbar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 5px;
    padding: 5px 10px; background: #131820; border-bottom: 1px solid var(--border);
  }
  .toolbar .sep {
    width: 1px; height: 18px; background: var(--border); margin: 0 2px;
  }

  .tabs {
    display: flex; gap: 4px; padding: 4px 10px; background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  .tabs button { flex: 1; padding: 6px; }

  .panes {
    flex: 1; display: flex; min-height: 0; overflow: hidden;
  }
  .pane {
    flex: 1; display: none; flex-direction: column; min-width: 0; min-height: 0;
  }
  .pane.visible { display: flex; }
  .term-wrap {
    flex: 1; min-height: 0; padding: 8px;
    background: #2d333b;
    overflow: auto;
    display: flex; align-items: center; justify-content: center;
  }
  .term-box {
    background: #000;
    border: 1px solid #636e7b;
    border-radius: 4px;
    padding: 3px;
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.55);
  }

  .softkeys {
    display: flex; flex-wrap: nowrap; overflow-x: auto; gap: 5px;
    padding: 6px 8px; background: var(--panel); border-top: 1px solid var(--border);
    -webkit-overflow-scrolling: touch;
  }
  .softkeys button {
    padding: 7px 10px; font-size: 12px; flex: 0 0 auto;
  }

  /* File manager pane (B:) */
  .files-wrap {
    flex: 1; min-height: 0; overflow: auto; padding: 10px 14px;
    background: #141921; display: flex; flex-direction: column; gap: 8px;
  }
  .files-bar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
  }
  .files-path {
    font-family: ui-monospace, monospace; font-size: 13px; font-weight: 700;
    color: var(--accent); margin-right: auto;
  }
  .files-drop {
    border: 1px dashed #444c56; border-radius: 6px; padding: 6px;
    background: #0f131a; flex: 1; min-height: 120px; overflow: auto;
  }
  .files-drop.dragover { border-color: var(--accent2); background: #162233; }
  .files-table {
    width: 100%; border-collapse: collapse; font-size: 13px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .files-table th, .files-table td {
    text-align: left; padding: 5px 8px; border-bottom: 1px solid #222933;
  }
  .files-table th { color: var(--muted); font-size: 11px; font-weight: 600; }
  .files-table td.num { text-align: right; color: var(--muted); }
  .files-table td.act { text-align: right; white-space: nowrap; }
  .files-table td.act button { padding: 3px 8px; font-size: 11px; margin-left: 4px; }
  .files-table tr:hover td { background: #1b222c; }
  .files-dir { color: var(--accent2); cursor: pointer; font-weight: 700; }
  .files-name { cursor: pointer; }
  .files-name:hover { text-decoration: underline; color: var(--accent2); }
  .files-empty { color: var(--muted); padding: 18px; text-align: center; font-size: 13px; }
  .fview {
    display: none; flex-direction: column; min-height: 0; flex: 1.2;
    border: 1px solid var(--border); border-radius: 6px; background: #0b0e14;
    overflow: hidden;
  }
  .fview.open { display: flex; }
  .fview-head {
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
    padding: 5px 8px; background: #161b22; border-bottom: 1px solid var(--border);
    font-size: 12px;
  }
  .fview-title {
    font-family: ui-monospace, monospace; font-weight: 700; color: var(--accent);
    margin-right: auto;
  }
  .fview-body {
    flex: 1; min-height: 0; overflow: auto; margin: 0; padding: 8px 10px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12px; line-height: 1.45; color: #e6edf3; white-space: pre;
    tab-size: 8;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <span class="brand">cradle86</span>
    <span id="status" class="status">未接続</span>
    <button id="btn-webusb" class="primary" title="Android Chrome 推奨: 1回でMonitor+DOS+Disk B:同時接続">USB接続 (3ポート同時)</button>
    <button id="btn-ser-mon" title="PC向け Web Serial: Monitor (port 0)">Serial: Monitor</button>
    <button id="btn-ser-dos" title="PC向け Web Serial: DOS (port 1)">Serial: DOS</button>
    <button id="btn-ser-disk" title="PC向け Web Serial: Virtual Disk B: (port 3)">Serial: Disk B:</button>
    <button id="btn-disc" class="danger" disabled>切断</button>
  </header>

  <div class="toolbar">
    <button id="btn-start-dos" class="go" disabled>▶ DOS起動 (h)</button>
    <button id="btn-stop-dos" class="danger" disabled>■ 停止 (s)</button>
    <button id="btn-cpu" disabled>CPU確認</button>
    <span class="sep"></span>
    <button id="btn-sanity" disabled>SANITY</button>
    <button id="btn-mandel" disabled>MANDEL</button>
    <button id="btn-life" disabled>LIFE</button>
    <button id="btn-vi" disabled>VI</button>
    <button id="btn-dir" disabled>DIR</button>
    <span class="sep"></span>
    <button id="btn-disk-lsic" title="LHA255.EXE + LSIC330C.LZH 入り4MBイメージをB:にマウント">B: LHA+LSIC</button>
    <button id="btn-disk-load" title="FAT12イメージをB:にマウント">B:読込</button>
    <button id="btn-disk-save" title="現在のB:イメージを保存">B:保存</button>
    <button id="btn-disk-reset" title="B:を空の1MB FAT12で初期化">B:初期化</button>
    <span id="disk-stat" style="font-size:11px;color:var(--muted);margin-left:2px;">B: RAM 1MB</span>
    <input id="disk-file" type="file" accept=".img,.bin,.dsk,application/octet-stream" style="display:none">
    <span class="sep"></span>
    <button id="btn-font-dec" title="文字を小さく">A-</button>
    <button id="btn-font-inc" title="文字を大きく">A+</button>
    <button id="btn-fit" class="active" title="80x25をウィンドウに自動内接">自動</button>
  </div>

  <div class="tabs">
    <button id="tab-dos" class="active">DOS コンソール <span id="dos-state" style="font-weight:400;opacity:0.75;">(offline)</span></button>
    <button id="tab-mon">モニタ (Monitor) <span id="mon-state" style="font-weight:400;opacity:0.75;">(offline)</span></button>
    <button id="tab-files">B: ファイル</button>
  </div>

  <div class="panes">
    <section id="pane-dos" class="pane visible">
      <div class="term-wrap"><div class="term-box"><div id="term-dos"></div></div></div>
    </section>
    <section id="pane-mon" class="pane">
      <div class="term-wrap"><div class="term-box"><div id="term-mon"></div></div></div>
    </section>
    <section id="pane-files" class="pane">
      <div class="files-wrap">
        <div class="files-bar">
          <span id="files-path" class="files-path">B:\</span>
          <button id="btn-f-up">↑ 上へ</button>
          <button id="btn-f-upload" class="primary">↑ アップロード</button>
          <button id="btn-f-refresh">更新</button>
          <input id="f-upload-input" type="file" multiple style="display:none">
        </div>
        <div id="files-drop" class="files-drop">
          <table class="files-table">
            <thead><tr><th>名前</th><th style="text-align:right">サイズ</th><th>更新日時</th><th style="text-align:right">操作</th></tr></thead>
            <tbody id="files-tbody"></tbody>
          </table>
        </div>
        <div id="fview" class="fview">
          <div class="fview-head">
            <span id="fview-title" class="fview-title"></span>
            <button id="btn-fv-sjis">SJIS</button>
            <button id="btn-fv-hex">HEX</button>
            <button id="btn-fv-more" style="display:none">全表示</button>
            <button id="btn-fv-dl">DL</button>
            <button id="btn-fv-close">✕</button>
          </div>
          <pre id="fview-body" class="fview-body"></pre>
        </div>
        <div style="font-size:11px;color:var(--muted);">
          ※ ファイルをここにドラッグ&amp;ドロップでも追加できます。追加・削除後は DOS 側へ自動でディスク交換を通知します（ファイル名は 8.3 形式に正規化されます）。
        </div>
      </div>
    </section>
  </div>

  <div class="softkeys">
    <button data-key="esc">ESC</button>
    <button data-key="ctrlc">Ctrl+C</button>
    <button data-key="enter">Enter</button>
    <button data-key="bs">BS</button>
    <button data-key="tab">Tab</button>
    <button data-key="up">↑</button>
    <button data-key="down">↓</button>
    <button data-key="left">←</button>
    <button data-key="right">→</button>
    <button data-key="q">q</button>
    <button data-key="r">r</button>
    <button data-key="g">g</button>
  </div>
</div>

<script>
(() => {
  // USB descriptors from monitor/usb_descriptors.c
  const VID = 0x1209;
  const PID = 0x0001;
  // CDC 0 (Monitor): ctrl if=0, data if=1, bulk OUT=2, bulk IN=2
  // CDC 1 (DOS Con): ctrl if=2, data if=3, bulk OUT=4, bulk IN=4
  // CDC 3 (Disk B:): ctrl if=6, data if=7, bulk OUT=8, bulk IN=8
  const CDC_MON  = { ctrlIf: 0, dataIf: 1, epOut: 2, epIn: 2 };
  const CDC_DOS  = { ctrlIf: 2, dataIf: 3, epOut: 4, epIn: 4 };
  const CDC_DISK = { ctrlIf: 6, dataIf: 7, epOut: 8, epIn: 8 };

  const statusEl = document.getElementById('status');
  const monStateEl = document.getElementById('mon-state');
  const dosStateEl = document.getElementById('dos-state');
  const diskStatEl = document.getElementById('disk-stat');
  const paneDos = document.getElementById('pane-dos');
  const paneMon = document.getElementById('pane-mon');
  const paneFiles = document.getElementById('pane-files');
  const tabDos = document.getElementById('tab-dos');
  const tabMon = document.getElementById('tab-mon');
  const tabFiles = document.getElementById('tab-files');

  let activeTab = 'dos';
  let fontSize = 13;

  function makeTerm(cols, rows) {
    return new Terminal({
      cols, rows,
      fontSize,
      fontFamily: 'ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace',
      cursorBlink: true,
      scrollback: 1000,
      theme: {
        background: '#000000',
        foreground: '#e6edf3',
        cursor: '#3fb950',
      },
    });
  }

  const termDos = makeTerm(80, 25);
  const termMon = makeTerm(80, 25);
  termDos.open(document.getElementById('term-dos'));
  termMon.open(document.getElementById('term-mon'));

  // Initial quick-start guide on DOS screen
  termDos.writeln('\x1b[1;32mcradle86 Web Terminal\x1b[0m  (NEC V30 / 80C88 on Raspberry Pi Pico)');
  termDos.writeln('------------------------------------------------------------------------');
  termDos.writeln('\x1b[1m[1. 接続]\x1b[0m');
  termDos.writeln('  Android Chrome : 上の \x1b[1;36m[USB接続 (3ポート同時)]\x1b[0m をタップして cradle86 を選択');
  termDos.writeln('  PC Chrome/Edge : 以下の順で 4 ポートが現れるので、対応するボタンで選択:');
  termDos.writeln('    1番目 (ttyACM0 / if00 / V30 Monitor)  -> \x1b[1;36m[Serial: Monitor]\x1b[0m');
  termDos.writeln('    2番目 (ttyACM1 / if02 / DOS Console)  -> \x1b[1;36m[Serial: DOS]\x1b[0m');
  termDos.writeln('    3番目 (ttyACM2 / if04 / DOS AUX)      -> (通常は未接続でOK)');
  termDos.writeln('    4番目 (ttyACM3 / if06 / Virtual Disk) -> \x1b[1;36m[Serial: Disk B:]\x1b[0m (任意)');
  termDos.writeln('');
  termDos.writeln('\x1b[1m[2. 起動]\x1b[0m');
  termDos.writeln('  \x1b[1;32m[▶ DOS起動 (h)]\x1b[0m を押すと MS-DOS 2.11 が起動します (日付/時刻も自動スキップ)。');
  termDos.writeln('');
  termDos.writeln('\x1b[1m[3. おすすめデモ]\x1b[0m');
  termDos.writeln('  \x1b[1;33mSANITY\x1b[0m : CPU種別判別 (V30 / 80C88) + メモリ・ディスク診断');
  termDos.writeln('  \x1b[1;33mMANDEL\x1b[0m : マンデルブロ集合描画 + 所要時間計測');
  termDos.writeln('  \x1b[1;33mLIFE\x1b[0m   : ライフゲーム (グライダー銃)  [r:ランダム g:銃 q:終了]');
  termDos.writeln('  \x1b[1;33mVI\x1b[0m     : テキストエディタ');
  termDos.writeln('');
  termDos.writeln('\x1b[1m[4. B:ドライブ (LSI C-86 試食版)]\x1b[0m');
  termDos.writeln('  \x1b[1;36m[B: LHA+LSIC]\x1b[0m を押してから DOS 上で \x1b[1;33mB:ENV\x1b[0m を実行すると、');
  termDos.writeln('  LHA255 と LSIC330C.LZH を自動展開して LCC が使えるようになります。');
  termMon.writeln('\x1b[1;32mcradle86 Monitor (Port 0)\x1b[0m  - 接続後に ? でコマンド一覧、cpu でCPU確認');

  // Shift_JIS decoders (streaming)
  const decDos = new TextDecoder('shift_jis', { fatal: false });
  const decMon = new TextDecoder('utf-8', { fatal: false });
  const enc = new TextEncoder();

  // Connection state
  let usbDev = null;
  let usbRunning = false;
  let serMon = null, serMonWriter = null, serMonReader = null;
  let serDos = null, serDosWriter = null, serDosReader = null;
  let serDisk = null, serDiskWriter = null, serDiskReader = null;

  // Serialize WebUSB bulk OUT writes per endpoint
  const outQueue = { mon: Promise.resolve(), dos: Promise.resolve(), disk: Promise.resolve() };

  // ---- Virtual Disk B: (1MB FAT12 in RAM, 4096B/sector matching A:) ----
  const DISK_SECTORS = 256;
  const DISK_SEC_SZ = 4096;
  const MEDIA_UNCHANGED = 1;
  const MEDIA_CHANGED = 0xFFFF;
  let diskImg = null;
  let diskChanged = true;
  let diskReads = 0, diskWrites = 0;

  function makeEmptyFat12() {
    const img = new Uint8Array(DISK_SECTORS * DISK_SEC_SZ);
    const dv = new DataView(img.buffer);
    img[0] = 0xEB; img[1] = 0x3C; img[2] = 0x90;
    const oem = 'CRADLE86';
    for (let i = 0; i < 8; i++) img[3 + i] = oem.charCodeAt(i);
    dv.setUint16(11, DISK_SEC_SZ, true); // BytesPerSec = 4096
    img[13] = 1;                         // SecPerClus = 1
    dv.setUint16(14, 1, true);           // RsvdSecCnt = 1
    img[16] = 2;                         // NumFATs = 2
    dv.setUint16(17, 128, true);         // RootEntCnt = 128 (1 sector)
    dv.setUint16(19, DISK_SECTORS, true);// TotSec16 = 256 (1MB)
    img[21] = 0xF8;                      // Media
    dv.setUint16(22, 1, true);           // FATSz16 = 1
    dv.setUint16(24, 32, true);          // SecPerTrk
    dv.setUint16(26, 64, true);          // NumHeads
    img[38] = 0x29;                      // BootSig
    dv.setUint32(39, 0x20260001, true);  // VolID
    const lab = 'CRADLE86   ';
    for (let i = 0; i < 11; i++) img[43 + i] = lab.charCodeAt(i);
    const fs = 'FAT12   ';
    for (let i = 0; i < 8; i++) img[54 + i] = fs.charCodeAt(i);
    img[510] = 0x55; img[511] = 0xAA;
    // FAT1 (sector 1) & FAT2 (sector 2)
    for (const fatOff of [DISK_SEC_SZ, DISK_SEC_SZ * 2]) {
      img[fatOff] = 0xF8; img[fatOff + 1] = 0xFF; img[fatOff + 2] = 0xFF;
    }
    return img;
  }

  function updateDiskStat() {
    const kb = Math.round(diskImg.length / 1024);
    const conn = isDiskConnected() ? 'online' : 'offline';
    diskStatEl.textContent = `B: ${kb}KB (${conn}, R:${diskReads} W:${diskWrites})`;
  }

  diskImg = makeEmptyFat12();

  // Streaming parser for disk_server.py protocol:
  //   req: 'DK' op(u8) drive(u8) seq(u32) offset(u32) length(u32) [+ length bytes for 'W']
  //   rsp: 'kd' op(u8) status(u8) seq(u32) value(u32) 0(u32)      [+ value bytes for 'R']
  let diskRxBuf = new Uint8Array(0);
  function concatU8(a, b) {
    if (a.length === 0) return b.slice();
    const out = new Uint8Array(a.length + b.length);
    out.set(a, 0); out.set(b, a.length);
    return out;
  }
  function sendDiskResp(op, status, seq, value, payload) {
    const resp = new Uint8Array(16 + (payload ? payload.length : 0));
    const dv = new DataView(resp.buffer);
    resp[0] = 0x6B; resp[1] = 0x64; // 'kd'
    resp[2] = op;
    resp[3] = status;
    dv.setUint32(4, seq, true);
    dv.setUint32(8, value, true);
    dv.setUint32(12, 0, true);
    if (payload) resp.set(payload, 16);
    sendBytes('disk', resp);
  }
  function onDiskBytes(chunk) {
    diskRxBuf = concatU8(diskRxBuf, chunk);
    while (diskRxBuf.length >= 16) {
      // Resync to 'DK'
      if (diskRxBuf[0] !== 0x44 || diskRxBuf[1] !== 0x4B) {
        let idx = -1;
        for (let i = 1; i < diskRxBuf.length - 1; i++) {
          if (diskRxBuf[i] === 0x44 && diskRxBuf[i + 1] === 0x4B) { idx = i; break; }
        }
        diskRxBuf = idx >= 0 ? diskRxBuf.subarray(idx) : diskRxBuf.subarray(diskRxBuf.length - 1);
        if (diskRxBuf.length < 16) return;
      }
      const dv = new DataView(diskRxBuf.buffer, diskRxBuf.byteOffset, 16);
      const op = diskRxBuf[2];
      const drive = diskRxBuf[3];
      const seq = dv.getUint32(4, true);
      const off = dv.getUint32(8, true);
      const len = dv.getUint32(12, true);
      const need = 16 + (op === 0x57 ? len : 0); // 'W' has payload
      if (diskRxBuf.length < need) return;

      const payload = op === 0x57 ? diskRxBuf.subarray(16, need) : null;
      diskRxBuf = diskRxBuf.subarray(need);

      if (drive !== 0) {
        sendDiskResp(op, 1, seq, 0);
      } else if (op === 0x52) { // 'R'
        if (off + len <= diskImg.length) {
          diskReads++;
          sendDiskResp(op, 0, seq, len, diskImg.subarray(off, off + len));
        } else {
          sendDiskResp(op, 1, seq, 0);
        }
      } else if (op === 0x57) { // 'W'
        if (off + len <= diskImg.length) {
          diskImg.set(payload, off);
          diskWrites++;
          sendDiskResp(op, 0, seq, 0);
        } else {
          sendDiskResp(op, 1, seq, 0);
        }
      } else if (op === 0x43) { // 'C' media check
        const v = diskChanged ? MEDIA_CHANGED : MEDIA_UNCHANGED;
        diskChanged = false;
        sendDiskResp(op, 0, seq, v);
      } else {
        sendDiskResp(op, 1, seq, 0);
      }
      updateDiskStat();
    }
  }

  document.getElementById('btn-disk-reset').onclick = () => {
    diskImg = makeEmptyFat12();
    diskChanged = true;
    diskReads = 0; diskWrites = 0;
    dirStack = [{ name: 'B:', clus: 0 }];
    updateDiskStat();
    if (activeTab === 'files') renderFileList();
  };
  document.getElementById('btn-disk-save').onclick = () => {
    const blob = new Blob([diskImg], { type: 'application/octet-stream' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'cradle86-b.img';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
  const diskFileInput = document.getElementById('disk-file');
  document.getElementById('btn-disk-load').onclick = () => diskFileInput.click();
  diskFileInput.onchange = async () => {
    const f = diskFileInput.files[0];
    if (!f) return;
    const buf = await f.arrayBuffer();
    diskImg = new Uint8Array(buf);
    diskChanged = true;
    diskReads = 0; diskWrites = 0;
    dirStack = [{ name: 'B:', clus: 0 }];
    updateDiskStat();
    if (activeTab === 'files') renderFileList();
    diskFileInput.value = '';
  };
  document.getElementById('btn-disk-lsic').onclick = async () => {
    const btn = document.getElementById('btn-disk-lsic');
    btn.disabled = true;
    try {
      setStatus('LHA255 + LSIC330C イメージ読込中...');
      const res = await fetch('./lsic-b.img.gz');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      let buf;
      if (typeof DecompressionStream !== 'undefined') {
        const ds = res.body.pipeThrough(new DecompressionStream('gzip'));
        buf = await new Response(ds).arrayBuffer();
      } else {
        throw new Error('DecompressionStream 非対応ブラウザです');
      }
      diskImg = new Uint8Array(buf);
      diskChanged = true;
      diskReads = 0; diskWrites = 0;
      dirStack = [{ name: 'B:', clus: 0 }];
      updateUI();
      if (activeTab === 'files') renderFileList();
      setStatus('B: に LHA255.EXE + LSIC330C.LZH (4MB) をマウントしました', 'ok');

    } finally {

    }
  };

  // ---- FAT12 File Manager for B: ----
  let dirStack = [{ name: 'B:', clus: 0 }]; // clus 0 = root directory

  function fatInfo(img) {
    const dv = new DataView(img.buffer, img.byteOffset, img.byteLength);
    const bytesPerSec = dv.getUint16(11, true);
    const secPerClus = img[13];
    const rsvdSec = dv.getUint16(14, true);
    const numFats = img[16];
    const rootEntCnt = dv.getUint16(17, true);
    const totSec = dv.getUint16(19, true) || dv.getUint32(32, true);
    const fatSz = dv.getUint16(22, true);
    if (!bytesPerSec || !secPerClus || !fatSz) throw new Error('Invalid FAT12 BPB');
    const fatStart = rsvdSec * bytesPerSec;
    const fatBytes = fatSz * bytesPerSec;
    const rootStart = fatStart + numFats * fatBytes;
    const rootBytes = rootEntCnt * 32;
    const dataStart = rootStart + rootBytes;
    const clusSize = bytesPerSec * secPerClus;
    const maxClus = Math.floor((totSec * bytesPerSec - dataStart) / clusSize) + 1;
    return { bytesPerSec, secPerClus, rsvdSec, numFats, rootEntCnt, totSec, fatSz,
             fatStart, fatBytes, rootStart, rootBytes, dataStart, clusSize, maxClus };
  }

  function getFat12(img, info, c) {
    const off = info.fatStart + Math.floor((c * 3) / 2);
    if (c & 1) return ((img[off] >> 4) | (img[off + 1] << 4)) & 0xFFF;
    return (img[off] | ((img[off + 1] & 0x0F) << 8)) & 0xFFF;
  }

  function setFat12(img, info, c, val) {
    const rel = Math.floor((c * 3) / 2);
    for (let f = 0; f < info.numFats; f++) {
      const off = info.fatStart + f * info.fatBytes + rel;
      if (c & 1) {
        img[off] = (img[off] & 0x0F) | ((val & 0x0F) << 4);
        img[off + 1] = (val >> 4) & 0xFF;
      } else {
        img[off] = val & 0xFF;
        img[off + 1] = (img[off + 1] & 0xF0) | ((val >> 8) & 0x0F);
      }
    }
  }

  function clusOffset(info, c) {
    return info.dataStart + (c - 2) * info.clusSize;
  }

  function getChain(img, info, startClus) {
    const chain = [];
    const seen = new Set();
    let c = startClus;
    while (c >= 2 && c <= info.maxClus && !seen.has(c)) {
      seen.add(c);
      chain.push(c);
      const next = getFat12(img, info, c);
      if (next >= 0xFF8 || next < 2) break;
      c = next;
    }
    return chain;
  }

  function freeChain(img, info, startClus) {
    for (const c of getChain(img, info, startClus)) setFat12(img, info, c, 0);
  }

  function allocChain(img, info, n) {
    if (n === 0) return [];
    const free = [];
    for (let c = 2; c <= info.maxClus && free.length < n; c++) {
      if (getFat12(img, info, c) === 0) free.push(c);
    }
    if (free.length < n) throw new Error('B: ドライブの空き容量が足りません');
    for (let i = 0; i < free.length; i++) {
      setFat12(img, info, free[i], i + 1 < free.length ? free[i + 1] : 0xFFF);
    }
    return free;
  }

  function dirSpans(img, info, dirClus) {
    if (dirClus === 0) return [{ off: info.rootStart, len: info.rootBytes }];
    return getChain(img, info, dirClus).map(c => ({ off: clusOffset(info, c), len: info.clusSize }));
  }

  function decode83(img, off) {
    let base = '', ext = '';
    for (let i = 0; i < 8; i++) base += String.fromCharCode(img[off + i]);
    for (let i = 0; i < 3; i++) ext += String.fromCharCode(img[off + 8 + i]);
    base = base.trimEnd();
    ext = ext.trimEnd();
    return ext ? `${base}.${ext}` : base;
  }

  function encode83(name) {
    const upper = name.toUpperCase();
    const dot = upper.lastIndexOf('.');
    let rawBase = dot > 0 ? upper.slice(0, dot) : upper;
    let rawExt = dot > 0 ? upper.slice(dot + 1) : '';
    const clean = s => s.replace(/[^A-Z0-9!#$%&'()\-@^_`{}~]/g, '');
    const base = (clean(rawBase) || 'FILE').slice(0, 8).padEnd(8, ' ');
    const ext = clean(rawExt).slice(0, 3).padEnd(3, ' ');
    const out = new Uint8Array(11);
    for (let i = 0; i < 8; i++) out[i] = base.charCodeAt(i);
    for (let i = 0; i < 3; i++) out[8 + i] = ext.charCodeAt(i);
    return out;
  }

  function listDir(img, dirClus) {
    const info = fatInfo(img);
    const dv = new DataView(img.buffer, img.byteOffset, img.byteLength);
    const entries = [];
    for (const sp of dirSpans(img, info, dirClus)) {
      for (let p = sp.off; p < sp.off + sp.len; p += 32) {
        const b0 = img[p];
        if (b0 === 0x00) return entries;
        if (b0 === 0xE5) continue;
        const attr = img[p + 11];
        if ((attr & 0x08) || attr === 0x0F) continue; // volume label / LFN
        const name = decode83(img, p);
        if (name === '.' || name === '..') continue;
        const clus = dv.getUint16(p + 26, true);
        const size = dv.getUint32(p + 28, true);
        const t = dv.getUint16(p + 22, true);
        const d = dv.getUint16(p + 24, true);
        const yr = ((d >> 9) & 0x7F) + 1980, mo = (d >> 5) & 0x0F, dy = d & 0x1F;
        const hr = (t >> 11) & 0x1F, mi = (t >> 5) & 0x3F;
        const dateStr = d ? `${yr}-${String(mo).padStart(2,'0')}-${String(dy).padStart(2,'0')} ${String(hr).padStart(2,'0')}:${String(mi).padStart(2,'0')}` : '';
        entries.push({ name, isDir: !!(attr & 0x10), clus, size, dateStr, entryOff: p });
      }
    }
    return entries;
  }

  function fatReadFile(img, startClus, size) {
    const info = fatInfo(img);
    const out = new Uint8Array(size);
    let written = 0;
    for (const c of getChain(img, info, startClus)) {
      const take = Math.min(info.clusSize, size - written);
      const off = clusOffset(info, c);
      out.set(img.subarray(off, off + take), written);
      written += take;
      if (written >= size) break;
    }
    return out;
  }

  function fatWriteFile(img, dirClus, filename, data) {
    const info = fatInfo(img);
    const dv = new DataView(img.buffer, img.byteOffset, img.byteLength);
    const n83 = encode83(filename);
    const match83 = off => {
      for (let i = 0; i < 11; i++) if (img[off + i] !== n83[i]) return false;
      return true;
    };

    // Find existing entry (to overwrite) or first free slot
    let slotOff = -1;
    let spans = dirSpans(img, info, dirClus);
    outer:
    for (const sp of spans) {
      for (let p = sp.off; p < sp.off + sp.len; p += 32) {
        const b0 = img[p];
        if (b0 === 0x00) {
          if (slotOff < 0) slotOff = p;
          break outer;
        }
        if (b0 === 0xE5) {
          if (slotOff < 0) slotOff = p;
          continue;
        }
        if (!(img[p + 11] & 0x18) && match83(p)) {
          freeChain(img, info, dv.getUint16(p + 26, true));
          slotOff = p;
          break outer;
        }
      }
    }
    if (slotOff < 0) {
      if (dirClus === 0) throw new Error('ルートディレクトリが一杯です');
      // Grow subdirectory by 1 cluster
      const chain = getChain(img, info, dirClus);
      const [newC] = allocChain(img, info, 1);
      setFat12(img, info, chain[chain.length - 1], newC);
      const off = clusOffset(info, newC);
      img.fill(0, off, off + info.clusSize);
      slotOff = off;
    }

    const needClus = data.length ? Math.ceil(data.length / info.clusSize) : 0;
    const chain = allocChain(img, info, needClus);
    for (let i = 0; i < chain.length; i++) {
      const off = clusOffset(info, chain[i]);
      const src = data.subarray(i * info.clusSize, Math.min(data.length, (i + 1) * info.clusSize));
      img.fill(0, off, off + info.clusSize);
      img.set(src, off);
    }

    const now = new Date();
    const dosTime = ((now.getHours() & 31) << 11) | ((now.getMinutes() & 63) << 5) | ((now.getSeconds() >> 1) & 31);
    const dosDate = ((Math.max(0, now.getFullYear() - 1980) & 127) << 9) | (((now.getMonth() + 1) & 15) << 5) | (now.getDate() & 31);
    img.fill(0, slotOff, slotOff + 32);
    img.set(n83, slotOff);
    img[slotOff + 11] = 0x20; // Archive
    dv.setUint16(slotOff + 22, dosTime, true);
    dv.setUint16(slotOff + 24, dosDate, true);
    dv.setUint16(slotOff + 26, chain.length ? chain[0] : 0, true);
    dv.setUint32(slotOff + 28, data.length, true);
    diskChanged = true;
    return decode83(img, slotOff);
  }

  function fatDeleteFile(img, entry) {
    const info = fatInfo(img);
    if (entry.clus >= 2) freeChain(img, info, entry.clus);
    img[entry.entryOff] = 0xE5;
    diskChanged = true;
  }

  function renderFileList() {
    const cur = dirStack[dirStack.length - 1];
    document.getElementById('files-path').textContent =
      dirStack.map(d => d.name).join('\\') + (dirStack.length === 1 ? '\\' : '');
    document.getElementById('btn-f-up').disabled = dirStack.length <= 1;

    const tbody = document.getElementById('files-tbody');
    tbody.innerHTML = '';
    let entries;
    try {
      entries = listDir(diskImg, cur.clus);
    } catch (err) {
      tbody.innerHTML = `<tr><td colspan="4" class="files-empty">FAT12 解析エラー: ${err.message}</td></tr>`;
      return;
    }
    entries.sort((a, b) => (b.isDir - a.isDir) || a.name.localeCompare(b.name));
    if (entries.length === 0) {
      tbody.innerHTML = '<tr><td colspan="4" class="files-empty">(ファイルがありません)</td></tr>';
      return;
    }
    for (const e of entries) {
      const tr = document.createElement('tr');
      const tdName = document.createElement('td');
      if (e.isDir) {
        tdName.textContent = e.name + '\\';
        tdName.className = 'files-dir';
        tdName.onclick = () => { dirStack.push({ name: e.name, clus: e.clus }); renderFileList(); };
      } else {
        tdName.textContent = e.name;
        tdName.className = 'files-name';
        tdName.onclick = () => openFilePreview(e);
      }
      const tdSize = document.createElement('td');
      tdSize.className = 'num';
      tdSize.textContent = e.isDir ? '<DIR>' : e.size.toLocaleString();
      const tdDate = document.createElement('td');
      tdDate.style.color = 'var(--muted)';
      tdDate.textContent = e.dateStr;
      const tdAct = document.createElement('td');
      tdAct.className = 'act';
      if (!e.isDir) {
        const bView = document.createElement('button');
        bView.textContent = '表示';
        bView.onclick = () => openFilePreview(e);
        const bDl = document.createElement('button');
        bDl.textContent = 'DL';
        bDl.onclick = () => downloadBytes(fatReadFile(diskImg, e.clus, e.size), e.name);
        const bDel = document.createElement('button');
        bDel.textContent = '削除';
        bDel.className = 'danger';
        bDel.onclick = () => {
          fatDeleteFile(diskImg, e);
          if (previewState && previewState.name === e.name) closeFilePreview();
          setStatus(`B: から ${e.name} を削除しました`, 'ok');
          renderFileList();
        };
        tdAct.append(bView, bDl, bDel);
      }
      tr.append(tdName, tdSize, tdDate, tdAct);
      tbody.appendChild(tr);
    }
  }

  function downloadBytes(data, filename) {
    const blob = new Blob([data], { type: 'application/octet-stream' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }

  // ---- File Preview (SJIS text / Hex dump) ----
  const fviewEl = document.getElementById('fview');
  const fviewTitle = document.getElementById('fview-title');
  const fviewBody = document.getElementById('fview-body');
  const btnFvSjis = document.getElementById('btn-fv-sjis');
  const btnFvHex = document.getElementById('btn-fv-hex');
  const btnFvMore = document.getElementById('btn-fv-more');
  let previewState = null; // { name, data, mode: 'sjis'|'hex', showAll: bool }
  const HEX_INITIAL_LIMIT = 32768;

  function looksLikeText(name, data) {
    if (/\.(EXE|COM|LZH|OBJ|LIB|IMG|BIN|SYS)$/i.test(name)) return false;
    const n = Math.min(data.length, 4096);
    for (let i = 0; i < n; i++) {
      const b = data[i];
      if (b === 0x00) return false;
    }
    return true;
  }

  function formatHexDump(data, limit) {
    const n = Math.min(data.length, limit);
    const lines = [];
    for (let i = 0; i < n; i += 16) {
      let hex = '';
      let asc = '';
      for (let j = 0; j < 16; j++) {
        if (j === 8) hex += ' ';
        if (i + j < n) {
          const b = data[i + j];
          hex += b.toString(16).toUpperCase().padStart(2, '0') + ' ';
          asc += (b >= 0x20 && b <= 0x7E) ? String.fromCharCode(b) : '.';
        } else {
          hex += '   ';
        }
      }
      lines.push(i.toString(16).toUpperCase().padStart(8, '0') + ': ' + hex + ' |' + asc + '|');
    }
    if (n < data.length) {
      lines.push(`... (${n.toLocaleString()} / ${data.length.toLocaleString()} bytes 表示。「全表示」で残りも表示)`);
    }
    return lines.join('\n');
  }

  function renderFilePreview() {
    if (!previewState) return;
    const { name, data, mode, showAll } = previewState;
    fviewTitle.textContent = `${name} (${data.length.toLocaleString()} B)`;
    btnFvSjis.classList.toggle('active', mode === 'sjis');
    btnFvHex.classList.toggle('active', mode === 'hex');
    if (mode === 'sjis') {
      btnFvMore.style.display = 'none';
      const dec = new TextDecoder('shift_jis', { fatal: false });
      fviewBody.textContent = dec.decode(data);
    } else {
      const limit = showAll ? data.length : HEX_INITIAL_LIMIT;
      btnFvMore.style.display = (!showAll && data.length > HEX_INITIAL_LIMIT) ? '' : 'none';
      fviewBody.textContent = formatHexDump(data, limit);
    }
    fviewEl.classList.add('open');
  }

  function openFilePreview(entry) {
    const data = fatReadFile(diskImg, entry.clus, entry.size);
    const mode = looksLikeText(entry.name, data) ? 'sjis' : 'hex';
    previewState = { name: entry.name, data, mode, showAll: false };
    renderFilePreview();
  }

  function closeFilePreview() {
    previewState = null;
    fviewEl.classList.remove('open');
    fviewBody.textContent = '';
  }

  btnFvSjis.onclick = () => { if (previewState) { previewState.mode = 'sjis'; renderFilePreview(); } };
  btnFvHex.onclick  = () => { if (previewState) { previewState.mode = 'hex'; renderFilePreview(); } };
  btnFvMore.onclick = () => { if (previewState) { previewState.showAll = true; renderFilePreview(); } };
  document.getElementById('btn-fv-dl').onclick = () => {
    if (previewState) downloadBytes(previewState.data, previewState.name);
  };
  document.getElementById('btn-fv-close').onclick = closeFilePreview;

  async function uploadFilesToB(fileList) {
    const cur = dirStack[dirStack.length - 1];
    const added = [];
    try {
      for (const f of fileList) {
        const data = new Uint8Array(await f.arrayBuffer());
        const saved = fatWriteFile(diskImg, cur.clus, f.name, data);
        added.push(saved);
      }
      if (added.length) {
        setStatus(`B: にアップロードしました: ${added.join(', ')}`, 'ok');
        renderFileList();
      }
    } catch (err) {
      setStatus('B: アップロードエラー: ' + err.message, 'err');
    }
  }

  const fUploadInput = document.getElementById('f-upload-input');
  document.getElementById('btn-f-upload').onclick = () => fUploadInput.click();
  fUploadInput.onchange = async () => {
    if (fUploadInput.files.length) await uploadFilesToB(fUploadInput.files);
    fUploadInput.value = '';
  };
  document.getElementById('btn-f-refresh').onclick = renderFileList;
  document.getElementById('btn-f-up').onclick = () => {
    if (dirStack.length > 1) { dirStack.pop(); renderFileList(); }
  };
  const filesDrop = document.getElementById('files-drop');
  filesDrop.addEventListener('dragover', ev => { ev.preventDefault(); filesDrop.classList.add('dragover'); });
  filesDrop.addEventListener('dragleave', () => filesDrop.classList.remove('dragover'));
  filesDrop.addEventListener('drop', async ev => {
    ev.preventDefault();
    filesDrop.classList.remove('dragover');
    if (ev.dataTransfer && ev.dataTransfer.files.length) {
      await uploadFilesToB(ev.dataTransfer.files);
    }
  });

  function setStatus(msg, cls = '') {
    statusEl.textContent = msg;
    statusEl.className = 'status ' + cls;
  }

  function isMonConnected() { return !!(usbDev || serMon); }
  function isDosConnected() { return !!(usbDev || serDos); }
  function isDiskConnected() { return !!(usbDev || serDisk); }

  function updateUI() {
    const monOk = isMonConnected();
    const dosOk = isDosConnected();
    const diskOk = isDiskConnected();
    monStateEl.textContent = monOk ? '(connected)' : '(offline)';
    dosStateEl.textContent = dosOk ? '(connected)' : '(offline)';
    updateDiskStat();

    document.getElementById('btn-disc').disabled = !(monOk || dosOk || diskOk);
    document.getElementById('btn-start-dos').disabled = !monOk;
    document.getElementById('btn-stop-dos').disabled = !monOk;
    document.getElementById('btn-cpu').disabled = !monOk;
    for (const id of ['btn-sanity', 'btn-mandel', 'btn-life', 'btn-vi', 'btn-dir']) {
      document.getElementById(id).disabled = !dosOk;
    }

    if (usbDev) {
      setStatus(`WebUSB 接続中 (Mon+DOS+B:): ${usbDev.productName || 'cradle86'}`, 'ok');
    } else if (monOk || dosOk || diskOk) {
      setStatus(`WebSerial: ${monOk ? 'Mon ' : ''}${dosOk ? 'DOS ' : ''}${diskOk ? 'B:' : ''}`.trim(), 'ok');
    } else {
      setStatus('未接続');
    }
  }

  let autoFit = true;
  const btnFit = document.getElementById('btn-fit');

  function switchTab(which) {
    activeTab = which;
    tabDos.classList.toggle('active', which === 'dos');
    tabMon.classList.toggle('active', which === 'mon');
    tabFiles.classList.toggle('active', which === 'files');
    paneDos.classList.toggle('visible', which === 'dos');
    paneMon.classList.toggle('visible', which === 'mon');
    paneFiles.classList.toggle('visible', which === 'files');
    if (which === 'files') {
      renderFileList();
    } else {
      if (autoFit) requestAnimationFrame(fitTerminal);
      (which === 'dos' ? termDos : termMon).focus();
    }
  }
  tabDos.onclick = () => switchTab('dos');
  tabMon.onclick = () => switchTab('mon');
  tabFiles.onclick = () => switchTab('files');

  function applyFontSize(sz) {
    fontSize = Math.max(6, Math.min(36, sz));
    termDos.options.fontSize = fontSize;
    termMon.options.fontSize = fontSize;
  }

  function fitTerminal() {
    if (activeTab === 'files') return;
    const pane = activeTab === 'dos' ? paneDos : paneMon;
    const wrap = pane.querySelector('.term-wrap');
    const availW = wrap.clientWidth - 26;
    const availH = wrap.clientHeight - 26;
    if (availW <= 40 || availH <= 40) return;

    // Measure current actual xterm screen size vs current fontSize to get exact ratio.
    const scr = pane.querySelector('.xterm-screen');
    let ratioW = 80 * 0.61;
    let ratioH = 25 * 1.20;
    if (scr && scr.offsetWidth > 0 && scr.offsetHeight > 0) {
      ratioW = scr.offsetWidth / fontSize;
      ratioH = scr.offsetHeight / fontSize;
    }
    let next = Math.floor(Math.min(availW / ratioW, availH / ratioH));
    next = Math.max(6, Math.min(36, next));
    applyFontSize(next);

    // Refine once in case font metrics round up at the new integer size.
    requestAnimationFrame(() => {
      const s2 = pane.querySelector('.xterm-screen');
      if (!s2) return;
      if ((s2.offsetWidth > availW || s2.offsetHeight > availH) && fontSize > 6) {
        applyFontSize(fontSize - 1);
      }
    });
  }

  document.getElementById('btn-font-dec').onclick = () => {
    autoFit = false;
    btnFit.classList.remove('active');
    applyFontSize(fontSize - 1);
  };
  document.getElementById('btn-font-inc').onclick = () => {
    autoFit = false;
    btnFit.classList.remove('active');
    applyFontSize(fontSize + 1);
  };
  btnFit.onclick = () => {
    autoFit = true;
    btnFit.classList.add('active');
    fitTerminal();
  };

  if (typeof ResizeObserver !== 'undefined') {
    const ro = new ResizeObserver(() => { if (autoFit) fitTerminal(); });
    ro.observe(document.querySelector('.panes'));
  }
  window.addEventListener('resize', () => { if (autoFit) fitTerminal(); });
  setTimeout(fitTerminal, 60);

  // ---- Write helpers ----
  function sendBytes(which, bytes) {
    if (usbDev) {
      const ep = which === 'mon' ? CDC_MON.epOut
               : which === 'dos' ? CDC_DOS.epOut : CDC_DISK.epOut;
      outQueue[which] = outQueue[which].then(async () => {
        if (!usbDev) return;
        for (let i = 0; i < bytes.length; i += 64) {
          await usbDev.transferOut(ep, bytes.subarray(i, i + 64));
        }
      }).catch(err => {
        console.error('USB write error', err);
      });
      return;
    }
    const writer = which === 'mon' ? serMonWriter
                 : which === 'dos' ? serDosWriter : serDiskWriter;
    if (writer) {
      writer.write(bytes).catch(err => console.error('Serial write error', err));
    }
  }

  function sendText(which, str) {
    sendBytes(which, enc.encode(str));
  }

  termMon.onData(data => sendText('mon', data));
  termDos.onData(data => sendText('dos', data));

  // ---- WebUSB (Android Chrome + 1-click dual port) ----
  async function cdcSetup(dev, cfg) {
    await dev.claimInterface(cfg.ctrlIf);
    await dev.claimInterface(cfg.dataIf);
    // SET_LINE_CODING: 115200 baud, 1 stop bit, no parity, 8 data bits
    // (Never send 1200 baud on PORT_MON as that reboots Pico into BOOTSEL!)
    const lineCoding = new Uint8Array([0x00, 0xC2, 0x01, 0x00, 0x00, 0x00, 0x08]);
    await dev.controlTransferOut({
      requestType: 'class',
      recipient: 'interface',
      request: 0x20, // SET_LINE_CODING
      value: 0,
      index: cfg.ctrlIf,
    }, lineCoding);
    // SET_CONTROL_LINE_STATE: DTR=1, RTS=1 (required for TinyUSB tud_cdc_n_connected)
    await dev.controlTransferOut({
      requestType: 'class',
      recipient: 'interface',
      request: 0x22, // SET_CONTROL_LINE_STATE
      value: 0x03,
      index: cfg.ctrlIf,
    });
  }

  async function usbReadLoop(dev, epIn, onData) {
    while (usbRunning && usbDev === dev) {
      try {
        const res = await dev.transferIn(epIn, 64);
        if (res.status === 'ok' && res.data && res.data.byteLength > 0) {
          const bytes = new Uint8Array(res.data.buffer, res.data.byteOffset, res.data.byteLength);
          onData(bytes);
        } else if (res.status === 'stall') {
          await dev.clearHalt('in', epIn);
        }
      } catch (err) {
        if (usbRunning) {
          console.error('USB read error on EP', epIn, err);
          setStatus('USB 切断されました', 'err');
          await disconnectAll();
        }
        break;
      }
    }
  }

  document.getElementById('btn-webusb').onclick = async () => {
    if (!navigator.usb) {
      setStatus('このブラウザは WebUSB 非対応です (Chrome を使用してください)', 'err');
      return;
    }
    try {
      await disconnectAll();
      const dev = await navigator.usb.requestDevice({
        filters: [{ vendorId: VID, productId: PID }],
      });
      await dev.open();
      if (dev.configuration === null) {
        await dev.selectConfiguration(1);
      }
      await cdcSetup(dev, CDC_MON);
      await cdcSetup(dev, CDC_DOS);
      await cdcSetup(dev, CDC_DISK);
      usbDev = dev;
      usbRunning = true;
      diskRxBuf = new Uint8Array(0);
      diskChanged = true;
      updateUI();

      usbReadLoop(dev, CDC_MON.epIn, b => termMon.write(decMon.decode(b, { stream: true })));
      usbReadLoop(dev, CDC_DOS.epIn, b => termDos.write(decDos.decode(b, { stream: true })));
      usbReadLoop(dev, CDC_DISK.epIn, onDiskBytes);

      // Query monitor version/CPU right away
      setTimeout(() => sendText('mon', '\rv\r'), 150);
    } catch (err) {
      if (err.name !== 'NotFoundError') {
        console.error(err);
        setStatus('WebUSB エラー: ' + err.message, 'err');
      }
    }
  };

  // ---- Web Serial (PC Chrome / Edge) ----
  async function connectSerial(which) {
    if (!navigator.serial) {
      setStatus('このブラウザは Web Serial 非対応です (Android は「USB接続」を使用)', 'err');
      return;
    }
    try {
      const port = await navigator.serial.requestPort({
        filters: [{ usbVendorId: VID, usbProductId: PID }],
      });
      await port.open({ baudRate: 115200 });
      const writer = port.writable.getWriter();
      const reader = port.readable.getReader();

      if (which === 'mon') {
        serMon = port; serMonWriter = writer; serMonReader = reader;
      } else if (which === 'dos') {
        serDos = port; serDosWriter = writer; serDosReader = reader;
      } else {
        serDisk = port; serDiskWriter = writer; serDiskReader = reader;
        diskRxBuf = new Uint8Array(0);
        diskChanged = true;
      }
      updateUI();

      const term = which === 'mon' ? termMon : termDos;
      const dec = which === 'mon' ? decMon : decDos;
      (async () => {
        try {
          while (true) {
            const { value, done } = await reader.read();
            if (done) break;
            if (value) {
              if (which === 'disk') onDiskBytes(value);
              else term.write(dec.decode(value, { stream: true }));
            }
          }
        } catch (e) {
          console.error('Serial read error', e);
        } finally {
          reader.releaseLock();
        }
      })();

      if (which === 'mon') setTimeout(() => sendText('mon', '\rv\r'), 150);
    } catch (err) {
      if (err.name !== 'NotFoundError') {
        setStatus('Web Serial エラー: ' + err.message, 'err');
      }
    }
  }

  document.getElementById('btn-ser-mon').onclick = () => connectSerial('mon');
  document.getElementById('btn-ser-dos').onclick = () => connectSerial('dos');
  document.getElementById('btn-ser-disk').onclick = () => connectSerial('disk');

  async function disconnectAll() {
    usbRunning = false;
    if (usbDev) {
      try { await usbDev.close(); } catch (_) {}
      usbDev = null;
    }
    for (const [p, w, r] of [
      [serMon, serMonWriter, serMonReader],
      [serDos, serDosWriter, serDosReader],
      [serDisk, serDiskWriter, serDiskReader],
    ]) {
      try { if (r) await r.cancel(); } catch (_) {}
      try { if (w) w.releaseLock(); } catch (_) {}
      try { if (p) await p.close(); } catch (_) {}
    }
    serMon = serMonWriter = serMonReader = null;
    serDos = serDosWriter = serDosReader = null;
    serDisk = serDiskWriter = serDiskReader = null;
    updateUI();
  }
  document.getElementById('btn-disc').onclick = disconnectAll;

  // ---- Demo Macro Buttons ----
  document.getElementById('btn-start-dos').onclick = () => {
    termDos.reset();
    sendText('mon', 'h\r');
    switchTab('dos');
    // Auto-skip MS-DOS date/time prompts after boot
    setTimeout(() => sendText('dos', '\r'), 2200);
    setTimeout(() => sendText('dos', '\r'), 3200);
  };
  document.getElementById('btn-stop-dos').onclick = () => {
    sendText('mon', 's\r');
    switchTab('mon');
  };
  document.getElementById('btn-cpu').onclick = () => {
    sendText('mon', 'cpu\r');
    switchTab('mon');
  };
  document.getElementById('btn-sanity').onclick = () => { switchTab('dos'); sendText('dos', 'SANITY\r'); };
  document.getElementById('btn-mandel').onclick = () => { switchTab('dos'); sendText('dos', 'MANDEL\r'); };
  document.getElementById('btn-life').onclick   = () => { switchTab('dos'); sendText('dos', 'LIFE\r'); };
  document.getElementById('btn-vi').onclick     = () => { switchTab('dos'); sendText('dos', 'VI\r'); };
  document.getElementById('btn-dir').onclick    = () => { switchTab('dos'); sendText('dos', 'DIR\r'); };

  // ---- Soft Keys ----
  const keyMap = {
    esc: '\x1b',
    ctrlc: '\x03',
    enter: '\r',
    bs: '\x08',
    tab: '\t',
    up: '\x1b[A',
    down: '\x1b[B',
    left: '\x1b[D',
    right: '\x1b[C',
    q: 'q',
    r: 'r',
    g: 'g',
  };
  document.querySelectorAll('.softkeys button').forEach(btn => {
    btn.onclick = () => {
      const seq = keyMap[btn.dataset.key];
      if (!seq) return;
      sendText(activeTab === 'mon' ? 'mon' : 'dos', seq);
    };
  });

  // Hide WebSerial buttons if browser doesn't support it (e.g. Android Chrome)
  if (!navigator.serial) {
    document.getElementById('btn-ser-mon').style.display = 'none';
    document.getElementById('btn-ser-dos').style.display = 'none';
    document.getElementById('btn-ser-disk').style.display = 'none';
  }
  if (!navigator.usb) {
    document.getElementById('btn-webusb').style.display = 'none';
  }

  updateUI();
})();
</script>
</body>
</html>
